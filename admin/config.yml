backend:
  name: github
  repo: Wasabie-studio/Oasys
  branch: main
  # Login relay only — the site itself stays on GitHub Pages.
  # This must be your deployed Cloudflare Worker's own URL
  # (cloudflare-worker/oauth-worker.js) — see admin/SETUP.md.
  base_url: https://oasys-cms-oauth.wasabie-studioo.workers.dev
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "assets/uploads"

publish_mode: simple

# NOTE on collections that appear in pairs/triples below (Team Photo, Sectors,
# Services, Partners, Articles): each one is a SEPARATE top-level collection,
# not grouped as sub-items of a parent. Decap CMS has a bug/limitation where
# multiple *files* inside ONE collection that point at the identical file path
# all render with the same (first) label in the sidebar — verified locally
# with Decap's no-login test-repo backend before shipping this structure.
# Separate top-level collections pointing at the same file path display and
# save correctly, so that's the pattern used here. They're declared next to
# each other so they stay visually grouped in the sidebar.

collections:
  - name: "hero"
    label: "Homepage Hero"
    files:
      - file: "data/hero.json"
        label: "Hero"
        name: "hero"
        fields:
          - {label: "Background photo", name: photo, widget: image, required: false}
          - {label: "Headline (English)", name: h_en, widget: string}
          - {label: "Headline (French)", name: h_fr, widget: string}
          - {label: "Subtext (English)", name: sub_en, widget: text}
          - {label: "Subtext (French)", name: sub_fr, widget: text}
          - {label: "Primary button label (English)", name: cta1_en, widget: string}
          - {label: "Primary button label (French)", name: cta1_fr, widget: string}
          - {label: "Secondary button label (English)", name: cta2_en, widget: string}
          - {label: "Secondary button label (French)", name: cta2_fr, widget: string}
          - label: "Company profile (PDF)"
            name: profile
            widget: file
            required: false
            hint: "Upload the company profile here. Leave this empty and the download button is hidden entirely, so the hero never shows a broken download."
          - {label: "Download button label (English)", name: cta3_en, widget: string, required: false}
          - {label: "Download button label (French)", name: cta3_fr, widget: string, required: false}

  - name: "world_map"
    label: "World Map — Homepage"
    description: "The 'Worldwide projects' map. Each row lights up every country in that region and shows its project count; the heading's 'across four continents' updates itself to match the number of rows."
    files:
      - file: "data/map.json"
        label: "Regions & project counts"
        name: "world_map"
        fields:
          - label: "Regions"
            name: items
            widget: list
            summary: "{{fields.region}} — {{fields.projects}} projects"
            hint: "Add a row per region. Drag the handle on the left to reorder — the order here is the order shown next to the map."
            fields:
              - label: "Region"
                name: region
                widget: select
                options:
                  - {label: "Africa", value: "africa"}
                  - {label: "Europe", value: "europe"}
                  - {label: "Asia", value: "asia"}
                  - {label: "North America", value: "north_america"}
                  - {label: "Central America", value: "central_america"}
                  - {label: "South America", value: "south_america"}
                  - {label: "Caribbean", value: "caribbean"}
                  - {label: "Oceania", value: "oceania"}
              - {label: "Number of projects", name: projects, widget: number, value_type: int, min: 0}

  - name: "team_photo_home"
    label: "Team Photo — Homepage"
    description: "Same photo as 'Team Photo — About Page' — publishing here updates both."
    files:
      - file: "data/team_photo.json"
        label: "Team Photo"
        name: "team_photo_home"
        fields:
          - {label: "Photo", name: photo, widget: image, required: false}
  - name: "team_photo_about"
    label: "Team Photo — About Page"
    description: "Same photo as 'Team Photo — Homepage' — publishing here updates both."
    files:
      - file: "data/team_photo.json"
        label: "Team Photo"
        name: "team_photo_about"
        fields:
          - {label: "Photo", name: photo, widget: image, required: false}

  - name: "team"
    label: "Team"
    description: "Two separate, independently-editable lists — updating one does NOT update the other. Click a row below to open it."
    files:
      - file: "data/team_home.json"
        label: "Team — Homepage Preview"
        name: "team_home"
        description: "Shown ONLY on the homepage's 'Meet the team' strip — not the About page."
        fields:
          - label: "Featured Team Members"
            name: items
            widget: list
            summary: "{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — the order here is the order they appear on the homepage."
            fields:
              - {label: "Name", name: name, widget: string}
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Role (English)", name: role_en, widget: string}
              - {label: "Role (French)", name: role_fr, widget: string}
      - file: "data/team.json"
        label: "Team — Full Roster (About page)"
        name: "team_roster"
        description: "Shown ONLY on the About page's full team grid — not the homepage."
        fields:
          - label: "Team Members"
            name: items
            widget: list
            summary: "{{fields.role_en}}{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — the order here is the order they appear on the About page."
            fields:
              - {label: "Name (leave blank to show role only)", name: name, widget: string, required: false}
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Group (English)", name: group_en, widget: string}
              - {label: "Group (French)", name: group_fr, widget: string}
              - {label: "Role (English)", name: role_en, widget: string}
              - {label: "Role (French)", name: role_fr, widget: string}

  - name: "sectors_home"
    label: "Sectors — Homepage"
    description: "Same list as 'Sectors — Services Page' — publishing here updates both."
    files:
      - file: "data/sectors.json"
        label: "Sectors"
        name: "sectors_home"
        fields:
          - label: "Sectors"
            name: items
            widget: list
            summary: "{{fields.en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on both the homepage and the Services page."
            fields:
              - {label: "Title (English)", name: en, widget: string}
              - {label: "Title (French)", name: fr, widget: string}
              - {label: "Photo", name: img, widget: image, required: false}
  - name: "sectors_services"
    label: "Sectors — Services Page"
    description: "Same list as 'Sectors — Homepage' — publishing here updates both."
    files:
      - file: "data/sectors.json"
        label: "Sectors"
        name: "sectors_services"
        fields:
          - label: "Sectors"
            name: items
            widget: list
            summary: "{{fields.en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on both the homepage and the Services page."
            fields:
              - {label: "Title (English)", name: en, widget: string}
              - {label: "Title (French)", name: fr, widget: string}
              - {label: "Photo", name: img, widget: image, required: false}

  - name: "services_home"
    label: "Services — Homepage"
    description: "Same list as 'Services — Services Page' — publishing here updates both."
    files:
      - file: "data/services.json"
        label: "Services"
        name: "services_home"
        fields:
          - label: "Services"
            name: items
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on both the homepage and the Services page."
            fields:
              - {label: "Photo", name: img, widget: image, required: false}
              - {label: "Title (English)", name: title_en, widget: string}
              - {label: "Short description (English)", name: desc_en, widget: string}
              - {label: "Full description (English)", name: body_en, widget: text, required: false}
              - label: "Focus areas (English)"
                name: focus_en
                widget: list
                required: false
                field: {label: "Item", name: item, widget: string}
              - {label: "Title (French)", name: title_fr, widget: string}
              - {label: "Short description (French)", name: desc_fr, widget: string}
              - {label: "Full description (French)", name: body_fr, widget: text, required: false}
              - label: "Focus areas (French)"
                name: focus_fr
                widget: list
                required: false
                field: {label: "Item", name: item, widget: string}
  - name: "services_page"
    label: "Services — Services Page"
    description: "Same list as 'Services — Homepage' — publishing here updates both."
    files:
      - file: "data/services.json"
        label: "Services"
        name: "services_page"
        fields:
          - label: "Services"
            name: items
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on both the homepage and the Services page."
            fields:
              - {label: "Photo", name: img, widget: image, required: false}
              - {label: "Title (English)", name: title_en, widget: string}
              - {label: "Short description (English)", name: desc_en, widget: string}
              - {label: "Full description (English)", name: body_en, widget: text, required: false}
              - label: "Focus areas (English)"
                name: focus_en
                widget: list
                required: false
                field: {label: "Item", name: item, widget: string}
              - {label: "Title (French)", name: title_fr, widget: string}
              - {label: "Short description (French)", name: desc_fr, widget: string}
              - {label: "Full description (French)", name: body_fr, widget: text, required: false}
              - label: "Focus areas (French)"
                name: focus_fr
                widget: list
                required: false
                field: {label: "Item", name: item, widget: string}

  - name: "partners_home"
    label: "Partners — Homepage"
    description: "Same list as 'Partners — About Page' — publishing here updates both."
    files:
      - file: "data/partners.json"
        label: "Partners"
        name: "partners_home"
        fields:
          - label: "Partners"
            name: items
            widget: list
            summary: "{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on both the homepage and the About page."
            fields:
              - {label: "Name", name: name, widget: string}
              - {label: "Logo", name: logo, widget: image, required: false}
  - name: "partners_about"
    label: "Partners — About Page"
    description: "Same list as 'Partners — Homepage' — publishing here updates both."
    files:
      - file: "data/partners.json"
        label: "Partners"
        name: "partners_about"
        fields:
          - label: "Partners"
            name: items
            widget: list
            summary: "{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on both the homepage and the About page."
            fields:
              - {label: "Name", name: name, widget: string}
              - {label: "Logo", name: logo, widget: image, required: false}

  - name: "posts_home"
    label: "Articles — Homepage"
    description: "Same list as 'Articles — News Page' and 'Articles — Article Pages' — publishing here updates all three."
    files:
      - file: "data/posts.json"
        label: "Articles"
        name: "posts_home"
        fields:
          - label: "Featured on Homepage Hero banner"
            name: featured_hero_post
            widget: relation
            collection: "posts_article"
            file: "posts_article"
            search_fields: ["items.*.title_en"]
            value_field: "items.*.title_en"
            display_fields: ["items.*.title_en"]
            required: false
            hint: "Pick ONE article to show as a small clickable photo on the homepage's top Hero banner. Leave blank to hide it. This is separate from the 3 articles listed below in 'Recent work'."
          - label: "Articles"
            name: items
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on the homepage and the News page."
            fields:
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Category (English)", name: cat_en, widget: string, hint: "e.g. Digital, Governance, Health & Social — type anything"}
              - {label: "Category (French)", name: cat_fr, widget: string}
              - {label: "Date", name: date, widget: string, hint: "Format: DD.MM.YYYY"}
              - {label: "Title (English)", name: title_en, widget: string}
              - {label: "Title (French)", name: title_fr, widget: string}
              - {label: "Body (English) — leave blank for a headline-only item with no article page", name: body_en, widget: text, required: false}
              - {label: "Body (French)", name: body_fr, widget: text, required: false}
  - name: "posts_news"
    label: "Articles — News Page"
    description: "Same list as 'Articles — Homepage' and 'Articles — Article Pages' — publishing here updates all three."
    files:
      - file: "data/posts.json"
        label: "Articles"
        name: "posts_news"
        fields:
          - label: "Articles"
            name: items
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on the homepage and the News page."
            fields:
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Category (English)", name: cat_en, widget: string, hint: "e.g. Digital, Governance, Health & Social — type anything"}
              - {label: "Category (French)", name: cat_fr, widget: string}
              - {label: "Date", name: date, widget: string, hint: "Format: DD.MM.YYYY"}
              - {label: "Title (English)", name: title_en, widget: string}
              - {label: "Title (French)", name: title_fr, widget: string}
              - {label: "Body (English) — leave blank for a headline-only item with no article page", name: body_en, widget: text, required: false}
              - {label: "Body (French)", name: body_fr, widget: text, required: false}
  - name: "posts_article"
    label: "Articles — Article Pages"
    description: "Same list as 'Articles — Homepage' and 'Articles — News Page' — publishing here updates all three."
    files:
      - file: "data/posts.json"
        label: "Articles"
        name: "posts_article"
        fields:
          - label: "Articles"
            name: items
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on the homepage and the News page."
            fields:
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Category (English)", name: cat_en, widget: string, hint: "e.g. Digital, Governance, Health & Social — type anything"}
              - {label: "Category (French)", name: cat_fr, widget: string}
              - {label: "Date", name: date, widget: string, hint: "Format: DD.MM.YYYY"}
              - {label: "Title (English)", name: title_en, widget: string}
              - {label: "Title (French)", name: title_fr, widget: string}
              - {label: "Body (English) — leave blank for a headline-only item with no article page", name: body_en, widget: text, required: false}
              - {label: "Body (French)", name: body_fr, widget: text, required: false}
