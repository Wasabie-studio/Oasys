# ─────────────────────────────────────────────────────────────────────────────
# OASYS Groupe — content manager
#
# HOW THIS IS ORGANISED
#
# One sidebar entry per THING, named for what it is — not for the page it
# shows up on. An earlier version listed the same content twice or three times
# ("Sectors — Homepage" and "Sectors — Services Page", and so on) so an editor
# looking for a page would find it. That backfired: fourteen entries for seven
# pieces of content, and editing either copy silently rewrote the other. Now
# each thing is edited in exactly one place and its description names every
# page it appears on.
#
# Every section that holds a LIST is a "folder" collection, so clicking
# Partners lists the actual partners and clicking one opens just that partner.
# Each item is its own file under content/, with its own screen, its own
# history and a real New/delete button.
#
# The website itself reads the single data/*.json files, which
# scripts/build-content.mjs regenerates from content/ on every push (see
# .github/workflows/build-articles.yml). That keeps the site free of any
# GitHub API call, so it will go on working once it moves to o2switch.
# NOTHING under data/ should be edited by hand — the next publish overwrites
# it.
#
# Ordering: folder collections cannot be drag-reordered the way a list widget
# could, so every item carries a "Position" number instead. 1 shows first.
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: Wasabie-studio/Oasys
  branch: main
  # Login relay only — the site itself stays on GitHub Pages.
  # This must be your deployed Cloudflare Worker's own URL
  # (cloudflare-worker/oauth-worker.js) — see admin/SETUP.md.
  base_url: https://oasys-cms-oauth.wasabie-studioo.workers.dev
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "assets/uploads"

publish_mode: simple

# There is no preview template for this site, so don't offer a broken one.
show_preview_links: false

collections:
  # ───────────────────────────────── Hero ────────────────────────────────────
  - name: "hero"
    label: "Homepage hero"
    description: "The top of the homepage: the big headline, the photo behind it, the three buttons, and the small article photo in the corner."
    files:
      - file: "data/hero.json"
        label: "Homepage hero"
        name: "hero"
        fields:
          - {label: "Background photo", name: photo, widget: image, required: false}
          - {label: "Headline (English)", name: h_en, widget: string}
          - {label: "Headline (French)", name: h_fr, widget: string}
          - {label: "Subtext (English)", name: sub_en, widget: text}
          - {label: "Subtext (French)", name: sub_fr, widget: text}
          - {label: "Primary button label (English)", name: cta1_en, widget: string}
          - {label: "Primary button label (French)", name: cta1_fr, widget: string}
          - {label: "Secondary button label (English)", name: cta2_en, widget: string}
          - {label: "Secondary button label (French)", name: cta2_fr, widget: string}
          - label: "Company profile (PDF)"
            name: profile
            widget: file
            required: false
            hint: "Upload the company profile here. Leave this empty and the download button is hidden entirely, so the hero never shows a broken download."
          - {label: "Download button label (English)", name: cta3_en, widget: string, required: false}
          - {label: "Download button label (French)", name: cta3_fr, widget: string, required: false}
          - label: "Featured article photo"
            name: featured_hero_post
            widget: relation
            collection: "articles"
            search_fields: ["title_en"]
            value_field: "title_en"
            display_fields: ["title_en"]
            required: false
            hint: "Pick ONE article from News to show as a small clickable photo in the corner of the hero. It only appears if that article has a photo. Leave blank to hide it — this is separate from the three articles in 'Recent work' further down the homepage."

  # ──────────────────────────────── Map ──────────────────────────────────────
  - name: "map"
    label: "Homepage world map"
    label_singular: "Region"
    description: "The 'Worldwide projects' map. Each region lights up every country in it and shows its project count; the heading's 'across four continents' updates itself to match how many regions there are."
    folder: "content/map"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "region"
    slug: "{{region}}"
    summary: "{{region}} — {{projects}} projects"
    sortable_fields: ["order", "region", "projects"]
    fields:
      - label: "Position"
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: "1 shows first. Give two items the same number and they keep the order they are in."
      - label: "Region"
        name: region
        widget: select
        options:
          - {label: "Africa", value: "africa"}
          - {label: "Europe", value: "europe"}
          - {label: "Asia", value: "asia"}
          - {label: "North America", value: "north_america"}
          - {label: "Central America", value: "central_america"}
          - {label: "South America", value: "south_america"}
          - {label: "Caribbean", value: "caribbean"}
          - {label: "Oceania", value: "oceania"}
        hint: "Each region can only be listed once."
      - {label: "Number of projects", name: projects, widget: number, value_type: int, min: 0}

  # ─────────────────────────────── Sectors ───────────────────────────────────
  - name: "sectors"
    label: "Sectors"
    label_singular: "Sector"
    description: "The sector cards. Shown on the HOMEPAGE and the SERVICES page — one set, both places."
    folder: "content/sectors"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "en"
    slug: "{{slug}}"
    summary: "{{en}}"
    sortable_fields: ["order", "en"]
    fields:
      - label: "Position"
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: "1 shows first. Give two items the same number and they keep the order they are in."
      - {label: "Title (English)", name: en, widget: string}
      - {label: "Title (French)", name: fr, widget: string}
      - {label: "Photo", name: img, widget: image, required: false}

  # ─────────────────────────────── Services ──────────────────────────────────
  - name: "services"
    label: "Services"
    label_singular: "Service"
    description: "Shown on the HOMEPAGE and the SERVICES page — one set, both places."
    folder: "content/services"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title_en"
    slug: "{{slug}}"
    summary: "{{title_en}}"
    sortable_fields: ["order", "title_en"]
    fields:
      - label: "Position"
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: "1 shows first. Give two items the same number and they keep the order they are in."
      - {label: "Photo", name: img, widget: image, required: false}
      - {label: "Title (English)", name: title_en, widget: string}
      - {label: "Short description (English)", name: desc_en, widget: string}
      - {label: "Full description (English)", name: body_en, widget: text, required: false}
      - label: "Focus areas (English)"
        name: focus_en
        widget: list
        required: false
        field: {label: "Item", name: item, widget: string}
      - {label: "Title (French)", name: title_fr, widget: string}
      - {label: "Short description (French)", name: desc_fr, widget: string}
      - {label: "Full description (French)", name: body_fr, widget: text, required: false}
      - label: "Focus areas (French)"
        name: focus_fr
        widget: list
        required: false
        field: {label: "Item", name: item, widget: string}

  # ─────────────────────────────── Partners ──────────────────────────────────
  - name: "partners"
    label: "Partners"
    label_singular: "Partner"
    description: "The logo strip. Shown on the HOMEPAGE and the ABOUT page — one set, both places. A partner with no logo yet shows as a neutral placeholder."
    folder: "content/partners"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    summary: "{{name}}"
    sortable_fields: ["order", "name"]
    fields:
      - label: "Position"
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: "1 shows first. Give two items the same number and they keep the order they are in."
      - {label: "Name", name: name, widget: string}
      - {label: "Logo", name: logo, widget: image, required: false, hint: "Any shape or size — the site trims the background and scales every logo to look the same weight beside the others."}

  # ──────────────────────────── Team photo ───────────────────────────────────
  - name: "team_photo"
    label: "Team photo"
    description: "The group photo. Used on BOTH the homepage and the About page."
    files:
      - file: "data/team_photo.json"
        label: "Team photo"
        name: "team_photo"
        fields:
          - {label: "Photo", name: photo, widget: image, required: false}

  # ──────────────────────── Team — homepage strip ────────────────────────────
  - name: "team_homepage"
    label: "Team — homepage strip"
    label_singular: "Person"
    description: "The few faces on the homepage's 'Meet the team' strip. Independent of the About page roster — changing one does NOT change the other."
    folder: "content/team-homepage"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    summary: "{{name}} — {{role_en}}"
    sortable_fields: ["order", "name"]
    fields:
      - label: "Position"
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: "1 shows first. Give two items the same number and they keep the order they are in."
      - {label: "Name", name: name, widget: string}
      - {label: "Photo", name: photo, widget: image, required: false}
      - {label: "Role (English)", name: role_en, widget: string}
      - {label: "Role (French)", name: role_fr, widget: string}

  # ───────────────────────── Team — full roster ──────────────────────────────
  - name: "team_roster"
    label: "Team — full roster"
    label_singular: "Person"
    description: "The complete team grid on the About page. Independent of the homepage strip — changing one does NOT change the other."
    folder: "content/team-roster"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "role_en"
    slug: "{{slug}}"
    summary: "{{role_en}}{{name}}"
    sortable_fields: ["order", "role_en", "group_en"]
    fields:
      - label: "Position"
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: "1 shows first. Give two items the same number and they keep the order they are in."
      - {label: "Name (leave blank to show the role only)", name: name, widget: string, required: false}
      - {label: "Photo", name: photo, widget: image, required: false}
      - {label: "Group (English)", name: group_en, widget: string, hint: "People are grouped under this heading on the About page, e.g. Leadership, Delivery."}
      - {label: "Group (French)", name: group_fr, widget: string}
      - {label: "Role (English)", name: role_en, widget: string}
      - {label: "Role (French)", name: role_fr, widget: string}

  # ─────────────────────────────── Articles ──────────────────────────────────
  - name: "articles"
    label: "News articles"
    label_singular: "Article"
    description: "Feeds the News page, the 'Recent work' block on the homepage, and each article's own page — all three at once."
    folder: "content/articles"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title_en"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title_en}}"
    sortable_fields: ["order", "date", "title_en"]
    fields:
      - label: "Position"
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: "1 shows first. The homepage's 'Recent work' block shows positions 1, 2 and 3; the News page shows them all in this order. Give two articles the same number and the newer date wins."
      - label: "Date"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: false
        hint: "Pick the date of the event. The site displays it as DD.MM.YYYY."
      - {label: "Photo", name: photo, widget: image, required: false, hint: "Optional. An article with no photo still appears in the list, just without an image."}
      - {label: "Category (English)", name: cat_en, widget: string, hint: "e.g. Digital, Governance, Health & Social — type anything"}
      - {label: "Category (French)", name: cat_fr, widget: string}
      - {label: "Title (English)", name: title_en, widget: string}
      - {label: "Title (French)", name: title_fr, widget: string}
      - {label: "Body (English) — leave blank for a headline-only item with no article page", name: body_en, widget: text, required: false}
      - {label: "Body (French)", name: body_fr, widget: text, required: false}
