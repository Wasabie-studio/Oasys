# ─────────────────────────────────────────────────────────────────────────────
# OASYS Groupe — content manager
#
# HOW THIS IS ORGANISED
#
# One sidebar entry per THING, named for what it is — not for the page it
# shows up on. An earlier version of this file listed the same content twice
# or three times ("Sectors — Homepage" and "Sectors — Services Page", and so
# on) so that an editor looking for a page would find it. That backfired: it
# read as fourteen separate things to keep in step when there were only
# seven, and editing either copy silently changed the other. Now each entry
# is edited in exactly one place and its description names every page it
# appears on.
#
# Articles are a FOLDER collection — one entry per article, with a real "New
# article" button, its own screen and its own history, the same way the
# MyDNAPedia blog works. The website still reads a single data/posts.json,
# which .github/workflows/build-articles.yml regenerates on every push; that
# keeps the site free of any GitHub API call, so it will go on working once
# it moves to o2switch. Nobody should edit data/posts.json by hand.
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: Wasabie-studio/Oasys
  branch: main
  # Login relay only — the site itself stays on GitHub Pages.
  # This must be your deployed Cloudflare Worker's own URL
  # (cloudflare-worker/oauth-worker.js) — see admin/SETUP.md.
  base_url: https://oasys-cms-oauth.wasabie-studioo.workers.dev
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "assets/uploads"

publish_mode: simple

# There is no preview template for this site, so don't offer a broken one.
show_preview_links: false

collections:
  # ───────────────────────────────── 1. Hero ─────────────────────────────────
  - name: "hero"
    label: "Homepage hero"
    description: "The top of the homepage: the big headline, the photo behind it, the three buttons, and the small article photo in the corner."
    files:
      - file: "data/hero.json"
        label: "Hero"
        name: "hero"
        fields:
          - {label: "Background photo", name: photo, widget: image, required: false}
          - {label: "Headline (English)", name: h_en, widget: string}
          - {label: "Headline (French)", name: h_fr, widget: string}
          - {label: "Subtext (English)", name: sub_en, widget: text}
          - {label: "Subtext (French)", name: sub_fr, widget: text}
          - {label: "Primary button label (English)", name: cta1_en, widget: string}
          - {label: "Primary button label (French)", name: cta1_fr, widget: string}
          - {label: "Secondary button label (English)", name: cta2_en, widget: string}
          - {label: "Secondary button label (French)", name: cta2_fr, widget: string}
          - label: "Company profile (PDF)"
            name: profile
            widget: file
            required: false
            hint: "Upload the company profile here. Leave this empty and the download button is hidden entirely, so the hero never shows a broken download."
          - {label: "Download button label (English)", name: cta3_en, widget: string, required: false}
          - {label: "Download button label (French)", name: cta3_fr, widget: string, required: false}
          - label: "Featured article photo"
            name: featured_hero_post
            widget: relation
            collection: "articles"
            search_fields: ["title_en"]
            value_field: "title_en"
            display_fields: ["title_en"]
            required: false
            hint: "Pick ONE article from News to show as a small clickable photo in the corner of the hero. It only appears if that article has a photo. Leave blank to hide it — this is separate from the three articles in 'Recent work' further down the homepage."

  # ──────────────────────────────── 2. Map ──────────────────────────────────
  - name: "world_map"
    label: "Homepage world map"
    description: "The 'Worldwide projects' map. Each row lights up every country in that region and shows its project count; the heading's 'across four continents' updates itself to match the number of rows."
    files:
      - file: "data/map.json"
        label: "Regions & project counts"
        name: "world_map"
        fields:
          - label: "Regions"
            name: items
            widget: list
            summary: "{{fields.region}} — {{fields.projects}} projects"
            hint: "Add a row per region. Drag the handle on the left to reorder — the order here is the order shown next to the map."
            fields:
              - label: "Region"
                name: region
                widget: select
                options:
                  - {label: "Africa", value: "africa"}
                  - {label: "Europe", value: "europe"}
                  - {label: "Asia", value: "asia"}
                  - {label: "North America", value: "north_america"}
                  - {label: "Central America", value: "central_america"}
                  - {label: "South America", value: "south_america"}
                  - {label: "Caribbean", value: "caribbean"}
                  - {label: "Oceania", value: "oceania"}
              - {label: "Number of projects", name: projects, widget: number, value_type: int, min: 0}

  # ─────────────────────────────── 3. Sectors ───────────────────────────────
  - name: "sectors"
    label: "Sectors"
    description: "Appears on the HOMEPAGE and the SERVICES page. One list, shown in both places — edit it here and both update."
    files:
      - file: "data/sectors.json"
        label: "Sectors"
        name: "sectors"
        fields:
          - label: "Sectors"
            name: items
            widget: list
            summary: "{{fields.en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on the homepage and the Services page."
            fields:
              - {label: "Title (English)", name: en, widget: string}
              - {label: "Title (French)", name: fr, widget: string}
              - {label: "Photo", name: img, widget: image, required: false}

  # ─────────────────────────────── 4. Services ──────────────────────────────
  - name: "services"
    label: "Services"
    description: "Appears on the HOMEPAGE and the SERVICES page. One list, shown in both places — edit it here and both update."
    files:
      - file: "data/services.json"
        label: "Services"
        name: "services"
        fields:
          - label: "Services"
            name: items
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on the homepage and the Services page."
            fields:
              - {label: "Photo", name: img, widget: image, required: false}
              - {label: "Title (English)", name: title_en, widget: string}
              - {label: "Short description (English)", name: desc_en, widget: string}
              - {label: "Full description (English)", name: body_en, widget: text, required: false}
              - label: "Focus areas (English)"
                name: focus_en
                widget: list
                required: false
                field: {label: "Item", name: item, widget: string}
              - {label: "Title (French)", name: title_fr, widget: string}
              - {label: "Short description (French)", name: desc_fr, widget: string}
              - {label: "Full description (French)", name: body_fr, widget: text, required: false}
              - label: "Focus areas (French)"
                name: focus_fr
                widget: list
                required: false
                field: {label: "Item", name: item, widget: string}

  # ──────────────────────────────── 5. Team ─────────────────────────────────
  - name: "team"
    label: "Team"
    description: "The group photo, plus two separate people lists. Click a row below to open it."
    files:
      - file: "data/team_photo.json"
        label: "Group photo"
        name: "team_photo"
        description: "One photo, used on BOTH the homepage and the About page."
        fields:
          - {label: "Photo", name: photo, widget: image, required: false}
      - file: "data/team_home.json"
        label: "People — homepage strip"
        name: "team_home"
        description: "The few faces on the homepage's 'Meet the team' strip. This list is independent — changing it does NOT change the About page."
        fields:
          - label: "Featured Team Members"
            name: items
            widget: list
            summary: "{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — the order here is the order they appear on the homepage."
            fields:
              - {label: "Name", name: name, widget: string}
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Role (English)", name: role_en, widget: string}
              - {label: "Role (French)", name: role_fr, widget: string}
      - file: "data/team.json"
        label: "People — full roster (About page)"
        name: "team_roster"
        description: "The complete team grid on the About page. This list is independent — changing it does NOT change the homepage strip."
        fields:
          - label: "Team Members"
            name: items
            widget: list
            summary: "{{fields.role_en}}{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — the order here is the order they appear on the About page."
            fields:
              - {label: "Name (leave blank to show role only)", name: name, widget: string, required: false}
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Group (English)", name: group_en, widget: string}
              - {label: "Group (French)", name: group_fr, widget: string}
              - {label: "Role (English)", name: role_en, widget: string}
              - {label: "Role (French)", name: role_fr, widget: string}

  # ─────────────────────────────── 6. Partners ──────────────────────────────
  - name: "partners"
    label: "Partners"
    description: "The logo strip. Appears on the HOMEPAGE and the ABOUT page. One list, shown in both places — edit it here and both update."
    files:
      - file: "data/partners.json"
        label: "Partners"
        name: "partners"
        fields:
          - label: "Partners"
            name: items
            widget: list
            summary: "{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on the homepage and the About page."
            fields:
              - {label: "Name", name: name, widget: string}
              - {label: "Logo", name: logo, widget: image, required: false}

  # ─────────────────────────────── 7. Articles ──────────────────────────────
  - name: "articles"
    label: "News articles"
    label_singular: "Article"
    description: "One entry per article. These feed the News page, the 'Recent work' block on the homepage, and each article's own page — all three at once. Use 'New Article' to add one, and the bin icon to remove one."
    folder: "content/articles"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title_en"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{order}} · {{title_en}}"
    sortable_fields: ["order", "date", "title_en"]
    fields:
      - label: "Position on the site"
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: "1 shows first. The homepage's 'Recent work' block shows positions 1, 2 and 3; the News page shows them all in this order. Give two articles the same number and the newer date wins."
      - label: "Date"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: false
        hint: "Pick the date of the event. The site displays it as DD.MM.YYYY."
      - {label: "Photo", name: photo, widget: image, required: false, hint: "Optional. An article with no photo still appears in the list, just without an image."}
      - {label: "Category (English)", name: cat_en, widget: string, hint: "e.g. Digital, Governance, Health & Social — type anything"}
      - {label: "Category (French)", name: cat_fr, widget: string}
      - {label: "Title (English)", name: title_en, widget: string}
      - {label: "Title (French)", name: title_fr, widget: string}
      - {label: "Body (English) — leave blank for a headline-only item with no article page", name: body_en, widget: text, required: false}
      - {label: "Body (French)", name: body_fr, widget: text, required: false}
