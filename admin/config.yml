backend:
  name: github
  repo: Wasabie-studio/Oasys
  branch: main
  # Login relay only — the site itself stays on GitHub Pages.
  # This must be your deployed Cloudflare Worker's own URL
  # (cloudflare-worker/oauth-worker.js) — see admin/SETUP.md.
  base_url: https://oasys-cms-oauth.wasabie-studioo.workers.dev
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "assets/uploads"

publish_mode: simple

collections:
  - name: "hero"
    label: "Homepage Hero"
    files:
      - file: "data/hero.json"
        label: "Hero"
        name: "hero"
        fields:
          - {label: "Background photo", name: photo, widget: image, required: false}
          - {label: "Eyebrow tag (English)", name: kick_en, widget: string}
          - {label: "Eyebrow tag (French)", name: kick_fr, widget: string}
          - {label: "Headline (English)", name: h_en, widget: string}
          - {label: "Headline (French)", name: h_fr, widget: string}
          - {label: "Subtext (English)", name: sub_en, widget: text}
          - {label: "Subtext (French)", name: sub_fr, widget: text}
          - {label: "Primary button label (English)", name: cta1_en, widget: string}
          - {label: "Primary button label (French)", name: cta1_fr, widget: string}
          - {label: "Secondary button label (English)", name: cta2_en, widget: string}
          - {label: "Secondary button label (French)", name: cta2_fr, widget: string}

  - name: "team_photo"
    label: "Team Group Photo"
    description: "One shared photo, edited in one place — click either row below, they open the same photo. Publishing from either updates BOTH the homepage and the About page at once."
    files:
      - file: "data/team_photo.json"
        label: "Team Photo — Homepage"
        name: "team_photo_home"
        fields: &team_photo_fields
          - {label: "Photo", name: photo, widget: image, required: false}
      - file: "data/team_photo.json"
        label: "Team Photo — About Page"
        name: "team_photo_about"
        fields: *team_photo_fields

  - name: "sectors"
    label: "Sectors of Intervention"
    description: "One shared list, edited in one place — click either row below, they open the same list. Publishing from either updates BOTH the homepage carousel and the Services page's Sectors tab at once."
    files:
      - file: "data/sectors.json"
        label: "Sectors — Homepage"
        name: "sectors_home"
        fields: &sectors_fields
          - label: "Sectors"
            name: items
            widget: list
            summary: "{{fields.en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on both the homepage and the Services page."
            fields:
              - {label: "Title (English)", name: en, widget: string}
              - {label: "Title (French)", name: fr, widget: string}
              - {label: "Photo", name: img, widget: image, required: false}
      - file: "data/sectors.json"
        label: "Sectors — Services Page"
        name: "sectors_services"
        fields: *sectors_fields

  - name: "services"
    label: "Services"
    description: "One shared list, edited in one place — click either row below, they open the same list. Publishing from either updates BOTH the homepage showcase and the full Services page at once."
    files:
      - file: "data/services.json"
        label: "Services — Homepage"
        name: "services_home"
        fields: &services_fields
          - label: "Services"
            name: items
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on both the homepage and the Services page."
            fields:
              - {label: "Photo", name: img, widget: image, required: false}
              - {label: "Title (English)", name: title_en, widget: string}
              - {label: "Short description (English)", name: desc_en, widget: string}
              - {label: "Full description (English)", name: body_en, widget: text, required: false}
              - label: "Focus areas (English)"
                name: focus_en
                widget: list
                required: false
                field: {label: "Item", name: item, widget: string}
              - {label: "Title (French)", name: title_fr, widget: string}
              - {label: "Short description (French)", name: desc_fr, widget: string}
              - {label: "Full description (French)", name: body_fr, widget: text, required: false}
              - label: "Focus areas (French)"
                name: focus_fr
                widget: list
                required: false
                field: {label: "Item", name: item, widget: string}
      - file: "data/services.json"
        label: "Services — Services Page"
        name: "services_page"
        fields: *services_fields

  - name: "team"
    label: "Team"
    description: "Two separate, independently-editable lists — updating one does NOT update the other. Click a row below to open it."
    files:
      - file: "data/team_home.json"
        label: "Team — Homepage Preview"
        name: "team_home"
        description: "Shown ONLY on the homepage's 'Meet the team' strip — not the About page."
        fields:
          - label: "Featured Team Members"
            name: items
            widget: list
            summary: "{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — the order here is the order they appear on the homepage."
            fields:
              - {label: "Name", name: name, widget: string}
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Role (English)", name: role_en, widget: string}
              - {label: "Role (French)", name: role_fr, widget: string}
      - file: "data/team.json"
        label: "Team — Full Roster (About page)"
        name: "team_roster"
        description: "Shown ONLY on the About page's full team grid — not the homepage."
        fields:
          - label: "Team Members"
            name: items
            widget: list
            summary: "{{fields.role_en}}{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — the order here is the order they appear on the About page."
            fields:
              - {label: "Name (leave blank to show role only)", name: name, widget: string, required: false}
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Group (English)", name: group_en, widget: string}
              - {label: "Group (French)", name: group_fr, widget: string}
              - {label: "Role (English)", name: role_en, widget: string}
              - {label: "Role (French)", name: role_fr, widget: string}

  - name: "partners"
    label: "Partner & Client Logos"
    description: "One shared list, edited in one place — click either row below, they open the same list. Publishing from either updates BOTH the homepage logo marquee and the About page logo grid at once."
    files:
      - file: "data/partners.json"
        label: "Partners — Homepage"
        name: "partners_home"
        fields: &partners_fields
          - label: "Partners"
            name: items
            widget: list
            summary: "{{fields.name}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on both the homepage and the About page."
            fields:
              - {label: "Name", name: name, widget: string}
              - {label: "Logo", name: logo, widget: image, required: false}
      - file: "data/partners.json"
        label: "Partners — About Page"
        name: "partners_about"
        fields: *partners_fields

  - name: "posts"
    label: "News"
    description: "One shared list, edited in one place — click either row below, they open the same list. Publishing from either updates the homepage 'Recent work' teaser, the News page, AND every article page at once."
    files:
      - file: "data/posts.json"
        label: "Articles — Homepage"
        name: "posts_home"
        fields: &posts_fields
          - label: "Articles"
            name: items
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Drag the handle on the left of each card to reorder — this same order is used on the homepage and the News page."
            fields:
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Category (English)", name: cat_en, widget: string, hint: "e.g. Digital, Governance, Health & Social — type anything"}
              - {label: "Category (French)", name: cat_fr, widget: string}
              - {label: "Date", name: date, widget: string, hint: "Format: DD.MM.YYYY"}
              - {label: "Title (English)", name: title_en, widget: string}
              - {label: "Title (French)", name: title_fr, widget: string}
              - {label: "Body (English) — leave blank for a headline-only item with no article page", name: body_en, widget: text, required: false}
              - {label: "Body (French)", name: body_fr, widget: text, required: false}
      - file: "data/posts.json"
        label: "Articles — News Page"
        name: "posts_news"
        fields: *posts_fields
      - file: "data/posts.json"
        label: "Articles — Article Pages"
        name: "posts_article"
        fields: *posts_fields
