# Publishes the site to o2switch whenever main changes.
#
# Why this exists: the CMS at /admin writes its changes to THIS repository,
# not to the web server. On GitHub Pages that was enough, because Pages
# rebuilds itself on every commit. o2switch does not, so without this
# workflow Samba would publish in the CMS, the commit would land here, and
# the live site would sit unchanged.
#
# Setup, including the three secrets it needs, is in admin/DEPLOY-O2SWITCH.md.

name: Deploy to o2switch

on:
  push:
    branches: [main]
  # A commit made by a workflow does not itself trigger a `push` run, so the
  # bot commit from "Rebuild article index" would otherwise never reach
  # o2switch. `workflow_run` does fire for it.
  workflow_run:
    workflows: ["Rebuild site content"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — list what would be uploaded, upload nothing"
        type: boolean
        default: false

# One deploy at a time. If two CMS publishes land together, the later one
# wins rather than the two interleaving mid-upload.
concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload to o2switch over FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Upload
        id: upload
        env:
          FTP_HOST: ${{ secrets.O2SWITCH_FTP_HOST }}
          FTP_USER: ${{ secrets.O2SWITCH_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.O2SWITCH_REMOTE_DIR }}
          DELETE_REMOVED: ${{ vars.O2SWITCH_DELETE_REMOVED }}
          VERIFY_CERT: ${{ vars.O2SWITCH_VERIFY_CERT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          set_count=0
          missing=""
          for name in O2SWITCH_FTP_HOST O2SWITCH_FTP_USER O2SWITCH_FTP_PASSWORD; do
            case "$name" in
              O2SWITCH_FTP_HOST)     value="$FTP_HOST" ;;
              O2SWITCH_FTP_USER)     value="$FTP_USER" ;;
              O2SWITCH_FTP_PASSWORD) value="$FTP_PASSWORD" ;;
            esac
            if [ -n "$value" ]; then set_count=$((set_count + 1)); else missing="$missing $name"; fi
          done

          # Not set up yet (no secrets at all): skip quietly. o2switch hosting
          # is not live until someone adds them, and until then every CMS
          # publish would otherwise post a red X and mail a failure.
          if [ "$set_count" -eq 0 ]; then
            echo "::notice::o2switch deploy is not configured yet, so this push was not deployed."
            echo "To turn it on, add O2SWITCH_FTP_HOST, O2SWITCH_FTP_USER and"
            echo "O2SWITCH_FTP_PASSWORD under Settings -> Secrets and variables -> Actions."
            echo "Full instructions: admin/DEPLOY-O2SWITCH.md"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Half configured is a real mistake, so say so loudly.
          if [ -n "$missing" ]; then
            echo "::error::o2switch deploy is partly configured. Missing secret(s):$missing"
            echo "See admin/DEPLOY-O2SWITCH.md."
            exit 1
          fi

          # Where the site lives on the server. o2switch serves the primary
          # domain from public_html; an add-on domain has its own folder.
          REMOTE_DIR="${REMOTE_DIR:-public_html}"

          # Off by default: never remove a file on the server just because it
          # is not in this repo. Set the O2SWITCH_DELETE_REMOVED variable to
          # "true" once you are sure nothing else lives in that folder.
          if [ "${DELETE_REMOVED:-}" = "true" ]; then DELETE_FLAG="--delete"; else DELETE_FLAG=""; fi

          # o2switch presents a valid certificate, so verification stays on.
          # If their FTP hostname ever mismatches the certificate, set the
          # O2SWITCH_VERIFY_CERT variable to "false" to get unblocked, and
          # treat that as a thing to fix rather than leave.
          if [ "${VERIFY_CERT:-true}" = "false" ]; then VERIFY="false"; else VERIFY="true"; fi

          if [ "${DRY_RUN:-false}" = "true" ]; then DRY_FLAG="--dry-run"; else DRY_FLAG=""; fi

          echo "Host        : $FTP_HOST"
          echo "Remote dir  : $REMOTE_DIR"
          echo "Delete stale: ${DELETE_REMOVED:-false}"
          echo "Verify cert : $VERIFY"
          echo "Dry run     : ${DRY_RUN:-false}"

          # -R mirrors LOCAL -> REMOTE. Everything excluded below is repo
          # plumbing or docs that should not be served.
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate $VERIFY;
            set net:max-retries 3;
            set net:timeout 20;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            # --no-perms: shared hosting often refuses SITE CHMOD, and with
            # fail-exit on, one refusal would abort the whole deploy.
            mirror -R $DELETE_FLAG $DRY_FLAG --no-perms --verbose --parallel=4 \
              --exclude-glob .git \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob cloudflare-worker/ \
              --exclude-glob content/ \
              --exclude-glob scripts/ \
              --exclude-glob .DS_Store \
              --exclude-glob .gitignore \
              --exclude-glob README.md \
              --exclude-glob brand.md \
              --exclude-glob admin/SETUP.md \
              --exclude-glob admin/DEPLOY-O2SWITCH.md \
              ./ '$REMOTE_DIR';
          "

      # Optional: set the repository variable O2SWITCH_SITE_URL (e.g.
      # https://oasysgroupe.com/) and each deploy checks the live page
      # afterwards, so a silent half-upload cannot look like success.
      - name: Check the live site
        if: steps.upload.outputs.skipped != 'true'
        env:
          SITE_URL: ${{ vars.O2SWITCH_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "::notice::Set the O2SWITCH_SITE_URL variable to have each deploy verify the live page."
            exit 0
          fi
          url="${SITE_URL%/}/oasys-home.html"
          echo "Checking $url"
          code=$(curl -sS -o /tmp/live.html -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 "$url" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::$url returned HTTP $code after deploying."
            exit 1
          fi
          if ! grep -q 'id="heroH"' /tmp/live.html; then
            echo "::error::$url returned 200 but does not look like the OASYS homepage."
            exit 1
          fi
          echo "Live site responded 200 and looks right."

      - name: Done
        run: |
          if [ "${{ steps.upload.outputs.skipped }}" = "true" ]; then
            echo "Skipped: o2switch not configured yet."
          else
            echo "Deployed ${{ github.sha }} to o2switch."
          fi
