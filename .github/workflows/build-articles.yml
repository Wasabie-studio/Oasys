# Keeps data/posts.json in step with the articles in content/articles/.
#
# Why this exists: the CMS edits each news article as its own entry (a Decap
# "folder" collection), because one screen per article is what an editor can
# actually navigate. The website, though, is a plain static site that must
# keep working on o2switch with no GitHub API calls — so it reads one file,
# data/posts.json. This workflow is the bridge: whenever an article file
# changes, it regenerates that single file and commits it.
#
# It cannot loop: it only ever writes data/posts.json, which is not in the
# paths that trigger it.

name: Rebuild article index

on:
  push:
    branches: [main]
    paths:
      - "content/articles/**"
      - "scripts/build-posts.mjs"
  workflow_dispatch:

concurrency:
  group: build-articles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Rebuild data/posts.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild the index
        run: node scripts/build-posts.mjs

      - name: Commit it if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/posts.json; then
            echo "::notice::data/posts.json was already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git commit -m "Rebuild data/posts.json from content/articles/"
          # Someone may have pushed while we were building; rebase rather
          # than fail, so a CMS publish never ends in a red workflow.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing on the latest main."
            git pull --rebase origin main
          done
          echo "::error::Could not push the rebuilt data/posts.json after 3 attempts."
          exit 1
